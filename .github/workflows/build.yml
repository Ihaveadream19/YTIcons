name: build

on:

  push:

  workflow_dispatch:

jobs:

  build:

    runs-on: macos-latest

    steps:

      - name: checkout

        uses: actions/checkout@v4

      - name: setup theos

        run: |

          git clone https://github.com/theos/theos.git $HOME/theos

          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: install tools

        run: |

          brew install ldid dpkg make

      - name: build

        run: |

          make clean package FINALPACKAGE=1

      - name: collect files

        run: |

          mkdir out

          find .theos/obj -name "*.dylib" -exec cp {} out/ \;

          find .theos/obj -name "*.bundle" -exec cp -R {} out/ \;

          cp packages/*.deb out/ || true

      - name: upload

        uses: actions/upload-artifact@v4

        with:

          name: build

          path: out
