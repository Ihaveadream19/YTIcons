name: Build Tweak

on:

  push:

  workflow_dispatch:

jobs:

  build:

    runs-on: macos-latest

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Install Theos

        run: |

          git clone --recursive https://github.com/theos/theos.git $HOME/theos

          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install dependencies

        run: brew install make dpkg ldid

      - name: Setup YouTubeHeader

        run: |

          git clone https://github.com/PoomSmart/YouTubeHeader.git

          mkdir -p $HOME/theos/include

          cp -r YouTubeHeader $HOME/theos/include/

      - name: Build tweak

        run: |

          cd $GITHUB_WORKSPACE

          make clean package FINALPACKAGE=1

      - name: Upload deb

        uses: actions/upload-artifact@v4

        with:

          name: YTIcons

          path: packages/*.deb
